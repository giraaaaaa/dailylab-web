<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Lab</title>
  <meta name="description" content="Daily Lab은 손끝에 반응하는 웹 실험과 일기 앱 '오늘'을 만듭니다." />
  <link rel="canonical" href="https://www.dailylab.app/" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="author" content="Daily Lab" />
  <meta name="theme-color" content="#F1F1EF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
  <meta name="format-detection" content="telephone=no" />
  <!-- 검색 엔진 소유 확인: 발급받은 코드로 교체 후 주석 해제 (홈에 있어야 인증됨)
  <meta name="google-site-verification" content="GOOGLE_CODE" />
  <meta name="naver-site-verification" content="NAVER_CODE" />
  -->

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Daily Lab" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://www.dailylab.app/" />
  <meta property="og:title" content="Daily Lab" />
  <meta property="og:description" content="손끝에 반응하는 웹 실험과 일기 앱 '오늘'을 만듭니다." />
  <meta property="og:image" content="https://www.dailylab.app/img/og-home.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="젤리처럼 부푼 Daily Lab 워드마크" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.dailylab.app/img/og-home.jpg" />

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/img/icons/icon-180.png" />

  <link rel="preload" href="/assets/fonts/geist-black-dl.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" crossorigin />
  <link rel="stylesheet" href="/assets/tokens.css?v=1" />
  <link rel="stylesheet" href="/assets/home.css?v=2" />

  <script type="speculationrules">
  { "prerender": [{ "where": { "or": [{ "href_matches": "/lab" }, { "href_matches": "/today" }] }, "eagerness": "moderate" }] }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.dailylab.app/#org",
        "name": "Daily Lab",
        "alternateName": "데일리랩",
        "url": "https://www.dailylab.app/",
        "logo": { "@type": "ImageObject", "url": "https://www.dailylab.app/img/icons/icon-512.png", "width": 512, "height": 512 },
        "email": "dailylab.apps@gmail.com",
        "sameAs": ["https://apps.apple.com/kr/app/id6760692551"]
      },
      {
        "@type": "WebSite",
        "@id": "https://www.dailylab.app/#website",
        "url": "https://www.dailylab.app/",
        "name": "Daily Lab",
        "inLanguage": "ko-KR",
        "publisher": { "@id": "https://www.dailylab.app/#org" }
      }
    ]
  }
  </script>
</head>
<body>
  <div class="frame">
    <canvas class="stage" aria-hidden="true"></canvas>

    <header class="top">
      <p class="hint" aria-hidden="true">글자를 잡아당겨 보세요</p>
      <a class="contact reveal" style="--i: 3" href="mailto:dailylab.apps@gmail.com">문의</a>
    </header>

    <main class="center">
      <h1 class="mark"><span class="line"><i class="bl"></i>Daily</span> <span class="line"><i class="bl"></i>Lab</span></h1>
    </main>

    <div class="bottom">
      <nav class="exits" aria-label="Daily Lab이 만드는 것">
        <a class="exit reveal" style="--i: 0" href="/lab" data-exit>
          <span class="exit-name">실험실<span class="arrow" aria-hidden="true">→</span></span>
          <span class="exit-desc">손끝으로 만지는 웹 실험</span>
        </a>
        <a class="exit reveal" style="--i: 1" href="/today" data-exit>
          <span class="exit-name">오늘<span class="arrow" aria-hidden="true">→</span></span>
          <span class="exit-desc">AI가 답장하는 일기 앱</span>
        </a>
      </nav>
      <footer class="legal reveal" style="--i: 2">
        <span>© 2026 Daily Lab</span>
        <a href="/privacy">개인정보처리방침</a>
        <a href="/terms">이용약관</a>
      </footer>
    </div>
  </div>

  <script src="/assets/site.js" defer></script>
  <script type="module" src="/assets/home.js?v=1"></script>
</body>
</html>
